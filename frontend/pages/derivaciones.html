<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivaciones | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-1">Derivaciones</h1>
            <p class="text-muted mb-0">Conversaciones asignadas para atención humana.</p>
        </header>
        <p id="estado-derivaciones" class="alert d-none" role="status" aria-live="polite"></p>
        <p id="total-derivaciones" class="small text-muted" aria-live="polite"></p>
        <section id="lista-derivaciones" class="row g-3" aria-label="Derivaciones pendientes"></section>
        <nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Paginación de derivaciones">
            <button id="derivaciones-anterior" class="btn btn-outline-secondary btn-sm" type="button">Anterior</button>
            <span id="pagina-derivaciones" class="small text-muted" aria-live="polite"></span>
            <button id="derivaciones-siguiente" class="btn btn-outline-secondary btn-sm" type="button">Siguiente</button>
        </nav>
    </main>
    <script type="module" src="/static/js/pages/derivaciones.js"></script>
</body>
</html>
