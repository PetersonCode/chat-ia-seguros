<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acciones pendientes | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-1">Acciones pendientes</h1>
            <p class="text-muted mb-0">Completá la información necesaria y revisá las solicitudes.</p>
        </header>
        <p id="estado-acciones" class="alert d-none" role="status" aria-live="polite"></p>
        <div class="row g-3">
            <section class="col-12 col-xl-7 card shadow-sm border-0 h-100" aria-labelledby="titulo-lista-acciones">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h2 id="titulo-lista-acciones" class="h5 mb-0">Solicitudes</h2>
                    <span id="total-acciones" class="small text-muted" aria-live="polite"></span>
                </div>
                <p id="carga-acciones" class="px-3 pt-3 mb-0" role="status" aria-live="polite"></p>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Acción</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Antigüedad</th>
                                <th scope="col">Detalle</th>
                            </tr>
                        </thead>
                        <tbody id="filas-acciones"></tbody>
                    </table>
                </div>
                <nav class="card-footer bg-white d-flex justify-content-between align-items-center" aria-label="Paginación de acciones">
                    <button id="acciones-anterior" class="btn btn-outline-secondary btn-sm" type="button">Anterior</button>
                    <span id="pagina-acciones" class="small text-muted" aria-live="polite"></span>
                    <button id="acciones-siguiente" class="btn btn-outline-secondary btn-sm" type="button">Siguiente</button>
                </nav>
            </section>
            <section id="detalle-accion" class="col-12 col-xl-5" aria-labelledby="titulo-detalle-accion" hidden>
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white">
                        <h2 id="titulo-detalle-accion" class="h5 mb-0">Detalle de la acción</h2>
                    </div>
                    <div class="card-body">
                        <p id="descripcion-accion" class="fw-semibold"></p>
                        <p id="cliente-accion" class="text-muted"></p>
                        <h3 class="h6">Parámetros</h3>
                        <dl id="parametros-accion" class="row small"></dl>
                        <form id="formulario-parametros" hidden>
                            <div id="campos-faltantes" class="mb-3"></div>
                            <button id="guardar-parametros" class="btn btn-outline-primary" type="submit">Guardar parámetros</button>
                        </form>
                        <p id="aviso-parametros" class="small text-muted" hidden></p>
                        <div id="acciones-resolucion" class="d-flex gap-2 mt-3" hidden>
                            <button id="aprobar-accion" class="btn btn-success" type="button">Aprobar</button>
                            <button id="rechazar-accion" class="btn btn-outline-danger" type="button">Rechazar</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <dialog id="dialogo-resolucion" class="dialog-accion">
        <div class="p-4">
            <h2 id="titulo-dialogo-resolucion" class="h5"></h2>
            <p id="descripcion-dialogo-resolucion"></p>
            <label id="label-motivo" class="form-label" for="motivo-resolucion"></label>
            <textarea id="motivo-resolucion" class="form-control mb-2" rows="3"></textarea>
            <p id="error-resolucion" class="text-danger small" role="alert" aria-live="assertive"></p>
            <div class="d-flex justify-content-end gap-2">
                <button id="cancelar-resolucion" class="btn btn-outline-secondary" type="button">Cancelar</button>
                <button id="confirmar-resolucion" class="btn btn-primary" type="button">Confirmar</button>
            </div>
        </div>
    </dialog>
    <script type="module" src="/static/js/pages/acciones.js"></script>
</body>
</html>
