<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de gestión | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v=20261026fix2">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-1">Reportes de gestión</h1>
            <p class="text-muted mb-0">Indicadores operativos calculados desde consultas, derivaciones y cobros registrados.</p>
        </header>
        <p id="estado-reportes" class="alert d-none" role="status" aria-live="polite"></p>
        <form id="filtros-reportes" class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-sm-5 col-lg-3">
                        <label class="form-label" for="reporte-desde">Desde</label>
                        <input id="reporte-desde" name="desde" class="form-control" type="date" required>
                    </div>
                    <div class="col-sm-5 col-lg-3">
                        <label class="form-label" for="reporte-hasta">Hasta</label>
                        <input id="reporte-hasta" name="hasta" class="form-control" type="date" required>
                    </div>
                    <div class="col-sm-2 col-lg-3">
                        <button id="generar-reporte" class="btn btn-primary w-100" type="submit">Generar</button>
                    </div>
                    <div class="col-lg-3">
                        <a id="exportar-reporte" class="btn btn-outline-secondary w-100" hidden>Exportar CSV</a>
                    </div>
                </div>
            </div>
        </form>
        <section aria-labelledby="titulo-indicadores" class="mb-4">
            <h2 id="titulo-indicadores" class="h5 mb-3">Indicadores del período</h2>
            <p id="periodo-reportado" class="small text-muted" aria-live="polite"></p>
            <div id="resumen-reportes" class="row g-3"></div>
        </section>
        <section class="card border-0 shadow-sm" aria-labelledby="titulo-motivos">
            <div class="card-header bg-white">
                <h2 id="titulo-motivos" class="h5 mb-0">Consultas por motivo</h2>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr><th scope="col">Motivo</th><th scope="col" class="text-end">Consultas</th></tr>
                    </thead>
                    <tbody id="filas-motivos"></tbody>
                </table>
            </div>
            <p id="motivos-vacios" class="card-body text-muted mb-0" hidden>No hay consultas en el período.</p>
        </section>
        <details class="mt-4">
            <summary class="small">Cómo se calculan</summary>
            <ul id="definiciones-reportes" class="small text-muted mt-2"></ul>
        </details>
    </main>
    <script type="module" src="/static/js/pages/reportes.js?v=20261026fix2"></script>
</body>
</html>
