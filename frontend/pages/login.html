<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
       <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/app.css?v=20261104integrado1">
</head>
<body class="pagina-login">
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container py-5">
        <section class="card login-card shadow-sm mx-auto" aria-labelledby="titulo-login">
            <div class="card-body p-4 p-md-5">
               <header class="text-center mb-4">
    <a class="login-logo" href="https://beelyora.com/castano-page" target="_blank" rel="noopener noreferrer"
        title="Sitio web de Seguros Castaño">
        <img src="/static/img/logo-castano.png?v=20261104integrado1" width="112" height="112"
            alt="Seguros Castaño: ir al sitio web (se abre en una pestaña nueva)">
    </a>
    <h1 id="titulo-login" class="visually-hidden">Seguros Castaño</h1>
    <p class="text-muted mt-3 mb-0">Ingresá al panel de supervisión</p>
</header>
                <p id="mensaje-login" class="alert alert-danger d-none" role="alert" aria-live="polite"></p>
                <form id="formulario-login">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input id="email" name="email" type="email" class="form-control" autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button id="boton-ingresar" class="btn btn-primary w-100" type="submit">Ingresar</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="/static/js/pages/login.js?v=20261104integrado1"></script>
</body>
</html>
