<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="pagina-login">
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container py-5">
        <section class="card login-card shadow-sm mx-auto" aria-labelledby="titulo-login">
            <div class="card-body p-4 p-md-5">
                <h1 id="titulo-login" class="h3 mb-2">Seguros Castaño</h1>
                <p class="text-muted mb-4">Ingresá al panel de supervisión</p>
                <p id="mensaje-login" class="alert alert-danger d-none" role="alert" aria-live="polite"></p>
                <form id="formulario-login">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input id="email" name="email" type="email" class="form-control" autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button id="boton-ingresar" class="btn btn-primary w-100" type="submit">Ingresar</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="/static/js/pages/login.js"></script>
</body>
</html>
