<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casos cerrados con alertas | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-1">Casos cerrados con alertas abiertas</h1>
            <p class="text-muted mb-0">Revisá los casos y reabrilos para continuar su supervisión.</p>
        </header>
        <section class="card shadow-sm border-0" aria-labelledby="titulo-casos">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h2 id="titulo-casos" class="h5 mb-0">Casos</h2>
                <span id="total-casos" class="small text-muted" aria-live="polite"></span>
            </div>
            <p id="estado-casos" class="px-3 pt-3 mb-0" role="status" aria-live="polite"></p>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Caso</th>
                            <th scope="col">Cliente</th>
                            <th scope="col">Consulta</th>
                            <th scope="col">Alertas abiertas</th>
                            <th scope="col">Severidad máxima</th>
                            <th scope="col">Conversación</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="filas-casos"></tbody>
                </table>
            </div>
            <nav class="card-footer bg-white d-flex justify-content-between align-items-center" aria-label="Paginación de casos cerrados">
                <button id="casos-anterior" class="btn btn-outline-secondary btn-sm" type="button">Anterior</button>
                <span id="pagina-casos" class="small text-muted" aria-live="polite"></span>
                <button id="casos-siguiente" class="btn btn-outline-secondary btn-sm" type="button">Siguiente</button>
            </nav>
        </section>
    </main>
    <script type="module" src="/static/js/pages/cerrados.js"></script>
</body>
</html>
