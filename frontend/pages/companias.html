<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compañías | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v=20261104vencimientos2">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-1">Compañías</h1>
            <p class="text-muted mb-0">Quién emite cada póliza y cuánta comisión deja. Desactivar una compañía no toca las pólizas que ya la usan.</p>
        </header>
        <p id="mensaje-pagina" class="alert d-none" role="status" aria-live="polite"></p>

        <div id="contenido-companias" hidden>
            <!-- `details` en vez de un collapse de Bootstrap: la página solo carga el CSS, no el JS. -->
            <details id="panel-alta-compania" class="card shadow-sm border-0 mb-3" hidden>
                <summary class="card-header bg-white h5 mb-0 py-3">Nueva compañía</summary>
                <form id="formulario-alta-compania" class="card-body" novalidate>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" for="alta-nombre">Nombre</label>
                            <input id="alta-nombre" name="nombre" class="form-control" autocomplete="off" required>
                            <p class="invalid-feedback mb-0" data-error="nombre"></p>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="alta-comision">Comisión (%)</label>
                            <input id="alta-comision" name="comision_pct" class="form-control" inputmode="decimal" autocomplete="off" placeholder="12,5" required>
                            <p class="invalid-feedback mb-0" data-error="comision_pct"></p>
                        </div>
                    </div>
                    <p id="estado-alta-compania" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></p>
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
                        <button id="alta-guardar" class="btn btn-primary" type="submit">Crear compañía</button>
                    </div>
                </form>
            </details>

            <section class="card shadow-sm border-0" aria-labelledby="titulo-companias">
                <div class="card-header bg-white">
                    <h2 id="titulo-companias" class="h5 mb-0">Compañías cargadas</h2>
                    <p id="aviso-comision" class="small text-muted mb-0" hidden>La comisión solo la ve quien puede aprobar.</p>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">Nombre</th>
                                <th scope="col">Comisión</th>
                                <th scope="col">Estado</th>
                                <th scope="col" id="columna-acciones" hidden><span class="visually-hidden">Acciones</span></th>
                            </tr>
                        </thead>
                        <tbody id="tabla-companias"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <dialog id="dialog-compania" class="dialog-accion">
        <form id="formulario-dialogo" class="p-4" method="dialog" novalidate>
            <h2 id="dialog-titulo" class="h5"></h2>
            <div id="dialog-campos"></div>
            <p id="dialog-error" class="small text-danger mb-2" role="alert"></p>
            <div class="d-flex justify-content-end gap-2">
                <button id="dialog-cancelar" class="btn btn-outline-secondary" type="button">Cancelar</button>
                <button id="dialog-confirmar" class="btn btn-primary" type="submit">Guardar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="/static/js/pages/companias.js?v=20261104vencimientos2"></script>
</body>
</html>
