<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversación | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div>
                <h1 id="titulo-chat" class="h3 fw-bold mb-1">Detalle de conversación</h1>
                <p id="estado-chat" class="text-muted mb-0"></p>
            </div>
            <div class="d-flex gap-2">
                <a href="/panel/" class="btn btn-outline-secondary btn-sm">Volver a la bandeja</a>
                <button id="boton-modo" class="btn btn-primary btn-sm" type="button" hidden></button>
            </div>
        </header>
        <p id="mensaje-pagina" class="alert d-none" role="status" aria-live="polite"></p>

        <div class="row g-3">
            <section class="col-12 col-xl-8" aria-labelledby="titulo-chat">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white">
                        <h2 id="contacto-chat" class="h6 mb-0">Chat</h2>
                    </div>
                    <div id="mensajes-chat" class="card-body chat-messages" aria-live="polite"></div>
                    <form id="formulario-respuesta" class="card-footer bg-white" hidden>
                        <p id="aviso-ventana" class="small text-danger mb-2" hidden></p>
                        <label class="form-label" for="texto-respuesta">Responder</label>
                        <div class="input-group">
                            <textarea id="texto-respuesta" class="form-control" rows="2" required></textarea>
                            <button id="boton-responder" class="btn btn-primary" type="submit">Enviar</button>
                        </div>
                    </form>
                </div>
            </section>

            <aside class="col-12 col-xl-4">
                <section class="card shadow-sm border-0 mb-3" aria-labelledby="titulo-cliente">
                    <div class="card-header bg-dark text-white">
                        <h2 id="titulo-cliente" class="h6 mb-0">Cliente y pólizas</h2>
                    </div>
                    <div id="panel-cliente" class="card-body">
                        <p class="text-muted mb-0">Cargando información…</p>
                    </div>
                </section>
                <section class="card shadow-sm border-0" aria-labelledby="titulo-alertas">
                    <div class="card-header bg-white">
                        <h2 id="titulo-alertas" class="h6 mb-0">Alertas</h2>
                    </div>
                    <div id="panel-alertas" class="card-body">
                        <p class="text-muted mb-0">Cargando alertas…</p>
                    </div>
                </section>
            </aside>
        </div>
    </main>

    <dialog id="dialog-accion" class="dialog-accion">
        <div class="p-4">
            <h2 id="dialog-titulo" class="h5"></h2>
            <p id="dialog-descripcion"></p>
            <label id="dialog-label" class="form-label" for="dialog-texto" hidden></label>
            <textarea id="dialog-texto" class="form-control mb-2" rows="4" hidden></textarea>
            <p id="dialog-error" class="text-danger small" role="alert" aria-live="assertive"></p>
            <div class="d-flex justify-content-end gap-2">
                <button id="dialog-cancelar" class="btn btn-outline-secondary" type="button">Cancelar</button>
                <button id="dialog-confirmar" class="btn btn-primary" type="button">Confirmar</button>
            </div>
        </div>
    </dialog>
    <script type="module" src="/static/js/pages/conversacion.js"></script>
</body>
</html>
