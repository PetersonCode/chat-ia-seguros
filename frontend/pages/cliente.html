<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de cliente | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 id="nombre-cliente" class="h3 fw-bold mb-1">Ficha de cliente</h1>
                <p id="datos-cliente" class="text-muted mb-0"></p>
                <span id="estado-activo-cliente" class="badge d-none mt-2"></span>
            </div>
            <div class="d-flex gap-2">
                <button id="boton-baja-cliente" class="btn btn-outline-danger btn-sm d-none" type="button">Dar de baja</button>
                <button id="boton-reactivar-cliente" class="btn btn-outline-success btn-sm d-none" type="button">Reactivar</button>
                <a href="/panel/clientes/" class="btn btn-outline-secondary btn-sm">Volver a clientes</a>
            </div>
        </header>
        <p id="estado-ficha" class="alert d-none" role="status" aria-live="polite"></p>

        <!-- `details` en vez de un collapse de Bootstrap: la página solo carga el CSS, no el JS. -->
        <details id="panel-edicion-cliente" class="card shadow-sm border-0 mb-3">
            <summary class="card-header bg-white h5 mb-0 py-3">Editar datos</summary>
            <form id="formulario-edicion-cliente" class="card-body" novalidate>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="editar-dni">DNI</label>
                        <input id="editar-dni" name="dni" class="form-control" autocomplete="off">
                        <p class="invalid-feedback mb-0" data-error="dni"></p>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="editar-nombre">Nombre</label>
                        <input id="editar-nombre" name="nombre" class="form-control" autocomplete="off">
                        <p class="invalid-feedback mb-0" data-error="nombre"></p>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="editar-apellido">Apellido</label>
                        <input id="editar-apellido" name="apellido" class="form-control" autocomplete="off">
                        <p class="invalid-feedback mb-0" data-error="apellido"></p>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="editar-telefono">WhatsApp</label>
                        <input id="editar-telefono" name="telefono" class="form-control" autocomplete="off">
                        <p class="invalid-feedback mb-0" data-error="telefono"></p>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="editar-email">Correo <span class="text-muted">(vaciar lo borra)</span></label>
                        <input id="editar-email" name="email" class="form-control" type="email" autocomplete="off">
                        <p class="invalid-feedback mb-0" data-error="email"></p>
                    </div>
                </div>
                <p id="estado-edicion-cliente" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></p>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button id="edicion-guardar" class="btn btn-primary" type="submit">Guardar cambios</button>
                </div>
            </form>
        </details>

        <section class="card shadow-sm border-0 mb-3" aria-labelledby="titulo-contactos">
            <div class="card-header bg-white">
                <h2 id="titulo-contactos" class="h5 mb-0">Contactos</h2>
            </div>
            <div id="contactos-cliente" class="card-body"></div>
        </section>
        <section class="mb-4" aria-labelledby="titulo-polizas">
            <h2 id="titulo-polizas" class="h4 mb-3">Pólizas</h2>
            <div id="polizas-cliente" class="row g-3"></div>
        </section>
        <section class="card shadow-sm border-0" aria-labelledby="titulo-siniestros">
            <div class="card-header bg-white">
                <h2 id="titulo-siniestros" class="h5 mb-0">Siniestros</h2>
            </div>
            <div id="siniestros-cliente" class="card-body"></div>
        </section>
    </main>
    <script type="module" src="/static/js/pages/cliente.js?v=2"></script>
</body>
</html>
