<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de cliente | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 id="nombre-cliente" class="h3 fw-bold mb-1">Ficha de cliente</h1>
                <p id="datos-cliente" class="text-muted mb-0"></p>
            </div>
            <a href="/panel/clientes/" class="btn btn-outline-secondary btn-sm">Volver a clientes</a>
        </header>
        <p id="estado-ficha" class="alert d-none" role="status" aria-live="polite"></p>
        <section class="card shadow-sm border-0 mb-3" aria-labelledby="titulo-contactos">
            <div class="card-header bg-white">
                <h2 id="titulo-contactos" class="h5 mb-0">Contactos</h2>
            </div>
            <div id="contactos-cliente" class="card-body"></div>
        </section>
        <section class="mb-4" aria-labelledby="titulo-polizas">
            <h2 id="titulo-polizas" class="h4 mb-3">Pólizas</h2>
            <div id="polizas-cliente" class="row g-3"></div>
        </section>
        <section class="card shadow-sm border-0" aria-labelledby="titulo-siniestros">
            <div class="card-header bg-white">
                <h2 id="titulo-siniestros" class="h5 mb-0">Siniestros</h2>
            </div>
            <div id="siniestros-cliente" class="card-body"></div>
        </section>
    </main>
    <script type="module" src="/static/js/pages/cliente.js"></script>
</body>
</html>
