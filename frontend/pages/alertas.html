<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                    <h1 class="h3 fw-bold mb-1">Alertas abiertas</h1>
                    <p class="text-muted mb-0">Revisá alertas y abrí la conversación relacionada.</p>
                </div>
                <a href="/panel/cerrados/" class="btn btn-outline-secondary btn-sm">Casos cerrados con alertas</a>
            </div>
        </header>
        <form id="filtros-alertas" class="card card-body shadow-sm border-0 mb-3">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-5">
                    <label for="filtro-tipo" class="form-label">Tipo de alerta</label>
                    <select id="filtro-tipo" class="form-select" name="tipo">
                        <option value="">Todos los tipos</option>
                        <option value="prompt_injection">Prompt injection</option>
                        <option value="fuga_datos">Fuga de datos</option>
                        <option value="accion_sin_aprobacion">Acción sin aprobación</option>
                        <option value="dato_inventado">Dato inventado</option>
                        <option value="dato_inconsistente">Dato inconsistente</option>
                        <option value="dato_no_verificado">Dato no verificado</option>
                    </select>
                </div>
                <div class="col-12 col-md-5">
                    <label for="filtro-severidad" class="form-label">Severidad</label>
                    <select id="filtro-severidad" class="form-select" name="severidad">
                        <option value="">Todas las severidades</option>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <button class="btn btn-primary w-100" type="submit">Filtrar</button>
                </div>
            </div>
        </form>
        <section class="card shadow-sm border-0" aria-labelledby="titulo-alertas">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h2 id="titulo-alertas" class="h5 mb-0">Resultados</h2>
                <span id="total-alertas" class="small text-muted" aria-live="polite"></span>
            </div>
            <p id="estado-alertas" class="px-3 pt-3 mb-0" role="status" aria-live="polite"></p>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Fecha</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Severidad</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Conversación</th>
                        </tr>
                    </thead>
                    <tbody id="filas-alertas"></tbody>
                </table>
            </div>
            <nav class="card-footer bg-white d-flex justify-content-between align-items-center" aria-label="Paginación de alertas">
                <button id="alertas-anterior" class="btn btn-outline-secondary btn-sm" type="button">Anterior</button>
                <span id="pagina-alertas" class="small text-muted" aria-live="polite"></span>
                <button id="alertas-siguiente" class="btn btn-outline-secondary btn-sm" type="button">Siguiente</button>
            </nav>
        </section>
    </main>
    <script type="module" src="/static/js/pages/alertas.js"></script>
</body>
</html>
