<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguros Castaño - Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/app.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="panel.html">Seguros Castaño</a>
            <div class="d-flex align-items-center text-white me-3">
                <span id="nav-user-name" class="small me-3">Cargando usuario...</span>
                <a href="login.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0">Gestión de Usuarios y Roles</h3>
                <p class="text-muted small mb-0">Administración de accesos del personal del backoffice</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
            </button>
        </div>

        <!-- Tabla de Usuarios -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <!-- Carga dinámicamente desde JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Crear Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-usuario">
                        <div class="mb-3">
                            <label for="usr-nombre" class="form-label small fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="usr-nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="usr-email" class="form-label small fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="usr-email" required>
                        </div>
                        <div class="mb-3">
                            <label for="usr-rol" class="form-label small fw-semibold">Rol asignado</label>
                            <select class="form-select" id="usr-rol" required>
                                <option value="operador">Operador (Solo lectura y atención)</option>
                                <option value="supervisor">Supervisor (Auditoría y aprobaciones)</option>
                                <option value="admin">Administrador (Control total)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/nav.js" type="module"></script>
    <script src="../static/js/pages/usuarios.js" type="module"></script>
</body>
</html>
