<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Seguros Castaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v=20261029a">
</head>
<body>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-1">Usuarios</h1>
            <p class="text-muted mb-0">Quién puede entrar al panel y qué puede hacer. Solo la ve el propietario.</p>
        </header>
        <p id="mensaje-pagina" class="alert d-none" role="status" aria-live="polite"></p>

        <div id="contenido-usuarios" hidden>
            <!-- `details` en vez de un collapse de Bootstrap: la página solo carga el CSS, no el JS. -->
            <details id="panel-alta-usuario" class="card shadow-sm border-0 mb-3">
                <summary class="card-header bg-white h5 mb-0 py-3">Nuevo usuario</summary>
                <form id="formulario-alta-usuario" class="card-body" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="alta-nombre">Nombre</label>
                            <input id="alta-nombre" name="nombre" class="form-control" autocomplete="off" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="alta-email">Correo</label>
                            <input id="alta-email" name="email" class="form-control" type="email" autocomplete="off" required>
                            <p class="form-text mb-0">Es el usuario para iniciar sesión. No se puede cambiar después.</p>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="alta-rol">Rol</label>
                            <select id="alta-rol" name="rol" class="form-select">
                                <option value="operador">Operador</option>
                                <option value="administracion">Administración</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="alta-clave">Contraseña</label>
                            <input id="alta-clave" name="clave" class="form-control" type="password" autocomplete="new-password" required minlength="8">
                            <p class="form-text mb-0">Al menos 8 caracteres, no solo números.</p>
                        </div>
                        <div class="col-md-4 d-flex align-items-center">
                            <div class="form-check mt-md-4">
                                <input id="alta-aprobar" name="puede_aprobar" class="form-check-input" type="checkbox">
                                <label class="form-check-label" for="alta-aprobar">Puede aprobar acciones</label>
                            </div>
                        </div>
                    </div>
                    <p id="estado-alta-usuario" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></p>
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
                        <button id="alta-guardar" class="btn btn-primary" type="submit">Crear usuario</button>
                    </div>
                </form>
            </details>

            <section class="card shadow-sm border-0" aria-labelledby="titulo-usuarios">
                <div class="card-header bg-white">
                    <h2 id="titulo-usuarios" class="h5 mb-0">Usuarios del panel</h2>
                </div>
                <div id="tabla-usuarios" class="grilla-tarjetas"></div>
            </section>
        </div>
    </main>

    <dialog id="dialog-usuario" class="dialog-accion">
        <form id="formulario-dialogo" method="dialog" novalidate>
            <h2 id="dialog-titulo" class="h5"></h2>
            <div id="dialog-campos"></div>
            <p id="dialog-error" class="small text-danger mb-2" role="alert"></p>
            <div class="d-flex justify-content-end gap-2">
                <button id="dialog-cancelar" class="btn btn-outline-secondary" type="button">Cancelar</button>
                <button id="dialog-confirmar" class="btn btn-primary" type="submit">Guardar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="/static/js/pages/usuarios.js?v=20261029a"></script>
</body>
</html>
